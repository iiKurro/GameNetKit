<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="GameNetKit: know your game server, fix your lag">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1117"/>
      <stop offset="0.55" stop-color="#0c1a16"/>
      <stop offset="1" stop-color="#0a0e13"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#35d07f" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#35d07f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8ff2bf"/>
      <stop offset="0.5" stop-color="#35d07f"/>
      <stop offset="1" stop-color="#3aa8ff"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#35d07f" stop-opacity="0"/>
      <stop offset="1" stop-color="#35d07f" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18222d"/>
      <stop offset="1" stop-color="#0b0f14"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="radar"><circle cx="1010" cy="214" r="150"/></clipPath>
    <style>
      text { font-family: "Segoe UI", "Inter", "Helvetica Neue", Arial, sans-serif; }
      .chip { font-size: 15px; font-weight: 700; fill: #e8edf3; }
      .chipbg { fill: #11171f; stroke: #2a3644; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1280" height="420" rx="26" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="26" fill="url(#dots)"/>
  <rect x="1.5" y="1.5" width="1277" height="417" rx="25" fill="none" stroke="#2a3644" stroke-width="3"/>
  <ellipse cx="1010" cy="214" rx="330" ry="260" fill="url(#glow)"><animate attributeName="opacity" values="0.7;1;0.7" dur="5s" repeatCount="indefinite"/></ellipse>

  <!-- left: logo tile and the words -->
  <g transform="translate(70 70)">
    <rect width="132" height="132" rx="32" fill="url(#tile)" stroke="#2a3644" stroke-width="2"/>
    <g transform="translate(66 66) scale(0.4) translate(-128 -128)">
      <path d="M 193.8 98.7 A 72 72 0 1 0 193.8 157.3" fill="none" stroke="#35d07f" stroke-width="17" stroke-linecap="round"/>
      <path d="M 82 134 L 104 134 L 120 86 L 142 180 L 158 134 L 214 134" fill="none" stroke="#e8edf3" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="260" stroke-dashoffset="0">
        <animate attributeName="stroke-dashoffset" values="260;0;0;260" keyTimes="0;0.35;0.8;1" dur="4.5s" repeatCount="indefinite"/>
      </path>
      <circle cx="214" cy="134" r="9" fill="#35d07f"><animate attributeName="r" values="9;14;9" dur="2.2s" repeatCount="indefinite"/></circle>
    </g>
  </g>
  <text x="232" y="150" font-size="76" font-weight="800" fill="url(#title)" letter-spacing="-1">GameNetKit</text>
  <text x="236" y="196" font-size="27" font-weight="600" fill="#e8edf3">Know your game server. Fix your lag.</text>
  <text x="236" y="236" font-size="24" fill="#9fb0c2">اعرف سيرفر لعبتك، وشف وين اللاق</text>

  <g transform="translate(70 290)">
    <rect width="250" height="54" rx="27" fill="#11171f" stroke="#2a3644" stroke-width="1.5"/>
    <circle cx="30" cy="27" r="6" fill="#35d07f"><animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <text x="48" y="33" font-size="17" font-weight="700" fill="#e8edf3">Live ping · jitter · loss</text>
    <rect x="266" width="168" height="54" rx="27" fill="#11171f" stroke="#2a3644" stroke-width="1.5"/>
    <text x="350" y="33" font-size="17" font-weight="700" fill="#e8edf3" text-anchor="middle">Windows 10 | 11</text>
  </g>

  <!-- right: a radar that finds the server -->
  <g>
    <circle cx="1010" cy="214" r="150" fill="#0a1310" stroke="#35d07f" stroke-opacity="0.45" stroke-width="2"/>
    <g clip-path="url(#radar)">
      <circle cx="1010" cy="214" r="100" fill="none" stroke="#35d07f" stroke-opacity="0.22" stroke-width="1.5"/>
      <circle cx="1010" cy="214" r="50" fill="none" stroke="#35d07f" stroke-opacity="0.22" stroke-width="1.5"/>
      <path d="M 860 214 H 1160 M 1010 64 V 364" stroke="#35d07f" stroke-opacity="0.18" stroke-width="1.5"/>
      <!-- the beam -->
      <g>
        <path d="M 1010 214 L 1160 214 A 150 150 0 0 0 1115.6 107.9 Z" fill="url(#sweep)" transform="rotate(-8 1010 214)"/>
        <animateTransform attributeName="transform" type="rotate" from="0 1010 214" to="360 1010 214" dur="4.8s" repeatCount="indefinite"/>
      </g>
    </g>
    <!-- servers found: one is the match server and locks on -->
    <g fill="#35d07f">
      <circle cx="950" cy="160" r="5" fill-opacity="0.7"><animate attributeName="fill-opacity" values="0.15;0.9;0.15" dur="4.8s" begin="0.5s" repeatCount="indefinite"/></circle>
      <circle cx="1090" cy="262" r="5" fill-opacity="0.7"><animate attributeName="fill-opacity" values="0.15;0.9;0.15" dur="4.8s" begin="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="975" cy="290" r="5" fill-opacity="0.7"><animate attributeName="fill-opacity" values="0.15;0.9;0.15" dur="4.8s" begin="3.5s" repeatCount="indefinite"/></circle>
    </g>
    <g>
      <circle cx="1068" cy="148" r="7" fill="#35d07f"/>
      <circle cx="1068" cy="148" r="7" fill="none" stroke="#35d07f" stroke-width="2"><animate attributeName="r" values="7;34" dur="2.4s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.9;0" dur="2.4s" repeatCount="indefinite"/></circle>
      <g fill="none" stroke="#e8edf3" stroke-width="2.5" stroke-linecap="round">
        <path d="M 1046 128 h-8 v8 M 1090 128 h8 v8 M 1046 168 h-8 v-8 M 1090 168 h8 v-8"/>
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.25;0.35;0.9;1" dur="4.8s" repeatCount="indefinite"/>
      </g>
    </g>
  </g>

  <!-- the numbers that float around it -->
  <g>
    <g transform="translate(1100 96)"><rect class="chipbg" width="110" height="38" rx="19"/><circle cx="20" cy="19" r="5" fill="#35d07f"/><text class="chip" x="34" y="24">31 ms</text>
      <animateTransform attributeName="transform" type="translate" values="1100 96;1100 88;1100 96" dur="5s" repeatCount="indefinite"/></g>
    <g transform="translate(790 292)"><rect class="chipbg" width="124" height="38" rx="19"/><circle cx="20" cy="19" r="5" fill="#3aa8ff"/><text class="chip" x="34" y="24">0% loss</text>
      <animateTransform attributeName="transform" type="translate" values="790 292;790 300;790 292" dur="6s" repeatCount="indefinite"/></g>
    <g transform="translate(1136 296)"><rect class="chipbg" width="104" height="38" rx="19"/><circle cx="20" cy="19" r="5" fill="#f2b64a"/><text class="chip" x="34" y="24">3 ms</text>
      <animateTransform attributeName="transform" type="translate" values="1136 296;1136 288;1136 296" dur="5.5s" repeatCount="indefinite"/></g>
  </g>
</svg>
